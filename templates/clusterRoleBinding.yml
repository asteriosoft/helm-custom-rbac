{{- if .Values.rbac.clusterRoles }}
{{- range $role := .Values.rbac.clusterRoles }}
{{- if and $role.enabled $role.binding.enabled }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
 name: {{ $role.name }}-clusterrolebinding
subjects:
{{- range $subject := $role.binding.subjects }}
- apiGroup: rbac.authorization.k8s.io
  kind: {{ $subject.kind }}
  name: {{ $subject.name }}
{{- end }}
roleRef:
 kind: ClusterRole
 name: {{ $role.name }}-clusterrole
 apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}