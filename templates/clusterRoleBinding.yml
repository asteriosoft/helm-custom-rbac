{{- if .Values.clusterRoleBindings }}
{{- range $bind := .Values.clusterRoleBindings  }}
{{- if $bind.enabled }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
 name: {{ $bind.name }}
subjects:
{{- range $subject := $bind.subjects }}
- apiGroup: {{ ternary "" "rbac.authorization.k8s.io" (eq $subject.kind "ServiceAccount") }}
  kind: {{ $subject.kind }}
  name: {{ $subject.name }}
  namespace: {{ ternary $subject.namespace "" (eq $subject.kind "ServiceAccount") }}
{{- end }}
roleRef:
 kind: ClusterRole
 name: {{ $bind.role }}
 apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}