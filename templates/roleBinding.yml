{{- if .Values.rbac.roleBindings }}
{{- range $bind := .Values.rbac.roleBindings  }}
{{- if $bind.enabled }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
 namespace: {{ $bind.namespace }}
 name: {{ $bind.name }}
subjects:
{{- range $subject := $bind.subjects }}
- apiGroup: {{ ternary "" "rbac.authorization.k8s.io" (eq $subject.kind "ServiceAccount") }}
  kind: {{ $subject.kind }}
  name: {{ $subject.name }}
  namespace: {{ $bind.namespace }}
{{- end }}
roleRef:
 kind: {{ $bind.role.kind | default "Role"  }}
 name: {{ $bind.role.name }}
 apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}