{{- if .Values.rbac.roles }}
{{- range $role := .Values.rbac.roles }}
{{- if and $role.enabled $role.binding.enabled }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
 namespace: {{ $role.namespace }}
 name: {{ $role.name }}-rolebinding
subjects:
{{- range $subject := $role.binding.subjects }}
- apiGroup: rbac.authorization.k8s.io
  kind: {{ $subject.kind }}
  name: {{ $subject.name }}
  namespace: {{ $role.namespace }}
{{- end }}
roleRef:
 kind: Role
 name: {{ $role.name }}-role
 apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}