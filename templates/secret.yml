{{- if .Values.rbac.serviceAccounts }}
{{- range $account := .Values.rbac.serviceAccounts }}
{{- if and $account.enabled $account.createToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $account.name }}-token
  namespace: {{ $account.namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $account.name }}
type: kubernetes.io/service-account-token
{{- end }}
{{- end }}
{{- end }}